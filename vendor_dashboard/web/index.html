<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MULTIVERSE Vendor Dashboard - Manage your shop, products, orders and earnings">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="vendor_dashboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MULTIVERSE Vendor Dashboard</title>
  <link rel="manifest" href="manifest.json">

  <script>
    window.flutterWebRenderer = "canvaskit";
  </script>

  <!-- Register Firebase Messaging Service Worker for Push Notifications -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js')
        .then((registration) => {
          console.log('✅ [Service Worker] Firebase Messaging registered');
        })
        .catch((error) => {
          console.log('❌ [Service Worker] Registration failed:', error);
        });
    }
  </script>

  <script>
    var serviceWorkerVersion = null;
  </script>
  <script type="application/javascript" src="flutter_bootstrap.js" async></script>
</head>
<body style="margin:0; padding:0; background-color:#0D0518;">
  <div id="loading" style="display:flex; align-items:center; justify-content:center; height:100vh; background-color:#0D0518;">
    <div style="text-align:center;">
      <div style="width:50px; height:50px; border:4px solid #333; border-top:4px solid #FF5722; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 16px;"></div>
      <p style="color:#999; font-family:Arial,sans-serif;">Loading...</p>
    </div>
  </div>
  <style>@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}</style>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
