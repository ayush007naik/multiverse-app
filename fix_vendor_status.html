<!DOCTYPE html>
<html>
<head>
    <title>Fix Vendor Shop Status</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body style="font-family: Arial; padding: 40px; background: #1a1a1a; color: white;">
    <h1>🔧 Fix Vendor Shop Status</h1>
    <p>Enter your Vendor ID and click Fix to enable orders</p>
    
    <div style="margin: 20px 0;">
        <label>Vendor ID:</label><br>
        <input type="text" id="vendorId" placeholder="Enter vendor ID from Firebase" 
               style="width: 400px; padding: 10px; margin-top: 5px; font-size: 14px;">
    </div>
    
    <button onclick="fixVendorStatus()" 
            style="padding: 15px 30px; background: #4CAF50; color: white; border: none; 
                   border-radius: 8px; font-size: 16px; cursor: pointer;">
        ✅ Fix Shop Status
    </button>
    
    <div id="result" style="margin-top: 20px; padding: 15px; border-radius: 8px;"></div>

    <script>
        // Your Firebase config
        const firebaseConfig = {
            apiKey: "AIza...",
            authDomain: "your-project.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function fixVendorStatus() {
            const vendorId = document.getElementById('vendorId').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!vendorId) {
                resultDiv.innerHTML = '<p style="color: red;">❌ Please enter Vendor ID</p>';
                return;
            }

            resultDiv.innerHTML = '<p>⏳ Updating...</p>';

            try {
                // Update vendors collection
                await db.collection('vendors').doc(vendorId).update({
                    isShopOpen: true,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // Update shops collection
                await db.collection('shops').doc(vendorId).update({
                    isShopOpen: true,
                    open: true,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                resultDiv.innerHTML = `
                    <div style="background: #2d5016; padding: 15px; border-radius: 8px;">
                        <h3 style="color: #4CAF50; margin: 0;">✅ Success!</h3>
                        <p>Shop status updated to OPEN</p>
                        <p>Try placing order now!</p>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <div style="background: #501616; padding: 15px; border-radius: 8px;">
                        <h3 style="color: red; margin: 0;">❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
